name: .NET CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: "23 16 * * *"

concurrency:
  group: dotnet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-scalable:
    name: Scalable and shared history
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore Scalable
        run: |
          dotnet workload restore .\Benchmark\Benchmark.Scalable.UI\Benchmark.Scalable.UI.csproj
          dotnet restore .\Benchmark\Benchmark.Scalable.UI\Benchmark.Scalable.UI.csproj -r win-x64
          dotnet restore .\Benchmark\Benchmark.Scalable.Tests\Benchmark.Scalable.Tests.csproj
          dotnet restore .\Benchmark\Benchmark.Infrastructure.Tests\Benchmark.Infrastructure.Tests.csproj
      - name: Test storage operations and shared history
        run: |
          dotnet test .\Benchmark\Benchmark.Infrastructure.Tests\Benchmark.Infrastructure.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=history.trx"
          dotnet test .\Benchmark\Benchmark.Scalable.Tests\Benchmark.Scalable.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=scalable.trx"
      - name: Build Scalable app
        run: dotnet build .\Benchmark\Benchmark.Scalable.UI\Benchmark.Scalable.UI.csproj -c Release -f net10.0-windows -r win-x64 --no-restore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scalable-history-results
          path: Benchmark/**/TestResults/**/*.trx
          if-no-files-found: ignore

  benchmark-dynamic:
    name: Benchmark Dynamic build and tests
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show .NET info
        run: dotnet --info

      - name: Restore MAUI workloads
        run: dotnet workload restore .\Benchmark\Benchmark.Dynamic.UI\Benchmark.Dynamic.UI.csproj

      - name: Restore Dynamic projects
        run: |
          dotnet restore .\Benchmark\Benchmark.Dynamic.UI\Benchmark.Dynamic.UI.csproj -r win-x64
          dotnet restore .\Benchmark.Dynamic.Tests\Benchmark.Dynamic.Tests.csproj
          dotnet restore .\Benchmark.Dynamic.UITests\Benchmark.Dynamic.UITests.csproj
          dotnet restore .\Test\Test.csproj
          dotnet restore .\Execution.Tests\Execution.Tests.csproj

      - name: Run execution contracts
        run: dotnet test .\Execution.Tests\Execution.Tests.csproj -c Debug --no-restore --logger "trx;LogFileName=execution.trx"
      - name: Test database streaming, transactions, and recovery
        run: >
          dotnet test .\Test\Test.csproj -c Debug -f net10.0 --no-restore
          --filter "FullyQualifiedName~DatabaseTransactionTests|FullyQualifiedName~DatabaseStoragePersistenceTests|FullyQualifiedName~SqlServerImportSizerTests|FullyQualifiedName~DatabaseToolImportIntegrationTests"
          --logger "trx;LogFileName=database-redesign.trx"

      - name: Run FLinq fixed-point tests
        run: >
          dotnet test .\Test\Test.csproj
          -c Debug
          -f net10.0-windows
          --no-restore
          -p:UseSharedCompilation=false
          --filter "FullyQualifiedName~OptimizationFixedPointTests"
          --logger "trx;LogFileName=benchmark-dynamic-fixedpoint.trx"

      - name: Run Dynamic unit and integration tests
        run: >
          dotnet test .\Benchmark.Dynamic.Tests\Benchmark.Dynamic.Tests.csproj
          -c Debug
          -f net10.0-windows
          --no-restore
          -p:UseSharedCompilation=false
          --filter "Category!=ChainCorpusFull&Category!=Survey"
          --logger "trx;LogFileName=benchmark-dynamic-tests.trx"

      - name: Build Benchmark Dynamic
        run: >
          dotnet build .\Benchmark\Benchmark.Dynamic.UI\Benchmark.Dynamic.UI.csproj
          -c Release
          -f net10.0-windows
          -r win-x64
          --no-restore
          -p:UseSharedCompilation=false
          "-p:BaseOutputPath=$env:RUNNER_TEMP\seamless-dynamic-bin\"

      - name: Verify Worker payload
        shell: pwsh
        run: |
          $worker = Get-ChildItem -Path "$env:RUNNER_TEMP\seamless-dynamic-bin" -Recurse -Filter Benchmark.Dynamic.Worker.exe | Where-Object { $_.Directory.Name -eq 'DynamicWorker' } | Select-Object -First 1
          if ($null -eq $worker) {
            throw "Benchmark.Dynamic.Worker.exe was not copied into the Release payload."
          }
          $required = @(
            "Benchmark.Dynamic.Worker.exe",
            "Benchmark.Dynamic.Worker.dll",
            "Benchmark.Dynamic.Worker.deps.json",
            "Benchmark.Dynamic.Worker.runtimeconfig.json",
            "Benchmark.Dynamic.Worker.pdb",
            "Benchmark.Infrastructure.dll",
            "Seamless.Collections.Tsavorite.dll",
            "Tsavorite.core.dll",
            "Microsoft.CodeAnalysis.CSharp.dll"
          )
          $missing = $required | Where-Object { -not (Test-Path -LiteralPath (Join-Path $worker.DirectoryName $_) -PathType Leaf) }
          if ($missing.Count -ne 0) {
            throw "Worker payload is incomplete: $($missing -join ', ')"
          }
          $required | ForEach-Object { Join-Path $worker.DirectoryName $_ }

      - name: Build Appium smoke tests
        run: >
          dotnet build .\Benchmark.Dynamic.UITests\Benchmark.Dynamic.UITests.csproj
          -c Debug
          --no-restore
          -p:UseSharedCompilation=false

      - name: Upload Dynamic test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-dynamic-test-results
          path: |
            Test/TestResults/**/*.trx
            Benchmark.Dynamic.Tests/TestResults/**/*.trx
          if-no-files-found: ignore

      - name: Upload Dynamic Release payload
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-dynamic-release
          path: ${{ runner.temp }}/seamless-dynamic-bin/**
          if-no-files-found: error

  benchmark-dynamic-random-corpus:
    name: Benchmark Dynamic 10k random corpus
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      BENCHMARK_DYNAMIC_RANDOM_CORPUS: 10000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Core-only corpus tests
        run: >
          dotnet restore .\Benchmark.Dynamic.Tests\Benchmark.Dynamic.Tests.csproj
          -p:CoreOnly=true

      - name: Run 10k deterministic corpus
        run: >
          dotnet test .\Benchmark.Dynamic.Tests\Benchmark.Dynamic.Tests.csproj
          -c Debug
          -f net10.0-windows
          --no-restore
          -p:CoreOnly=true
          -p:UseSharedCompilation=false
          --filter "Category=Corpus"
          --logger "trx;LogFileName=benchmark-dynamic-corpus-10k.trx"

      - name: Upload corpus test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-dynamic-corpus-10k-result
          path: Benchmark.Dynamic.Tests/TestResults/**/*.trx
          if-no-files-found: ignore

  benchmark-dynamic-nightly:
    name: Benchmark Dynamic nightly ${{ matrix.mode }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        mode:
          - ChainCorpusFull
          - Survey

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore MAUI workloads
        run: dotnet workload restore .\Benchmark\Benchmark.Dynamic.UI\Benchmark.Dynamic.UI.csproj

      - name: Restore Dynamic projects
        run: |
          dotnet restore .\Benchmark\Benchmark.Dynamic.UI\Benchmark.Dynamic.UI.csproj -r win-x64
          dotnet restore .\Benchmark.Dynamic.Tests\Benchmark.Dynamic.Tests.csproj

      - name: Build FLinq generator
        run: dotnet build .\Seamless.FLinq.Generator\Seamless.FLinq.Generator.csproj -c Debug -f netstandard2.0

      - name: Run full ChainCorpus
        if: matrix.mode == 'ChainCorpusFull'
        run: >
          dotnet test .\Benchmark.Dynamic.Tests\Benchmark.Dynamic.Tests.csproj
          -c Debug
          -f net10.0-windows
          --no-restore
          -p:UseSharedCompilation=false
          --filter "Category=ChainCorpusFull"
          --logger "trx;LogFileName=benchmark-dynamic-chain-corpus-full.trx"

      - name: Run evaluation count survey
        if: matrix.mode == 'Survey'
        env:
          EVAL_SURVEY: seamless-evaluation-survey.txt
          EVAL_SURVEY_STEP: 1
          EVAL_SURVEY_REQUIRE_CLEAN: 1
        run: >
          dotnet test .\Benchmark.Dynamic.Tests\Benchmark.Dynamic.Tests.csproj
          -c Debug
          -f net10.0-windows
          --no-restore
          -p:UseSharedCompilation=false
          --filter "Category=Survey"
          --logger "trx;LogFileName=benchmark-dynamic-evaluation-survey.trx"

      - name: Stage evaluation survey report
        if: always() && matrix.mode == 'Survey'
        shell: pwsh
        run: |
          $survey = Join-Path ([System.IO.Path]::GetTempPath()) "seamless-evaluation-survey.txt"
          if (Test-Path -LiteralPath $survey -PathType Leaf) {
            Copy-Item -LiteralPath $survey -Destination (Join-Path $env:RUNNER_TEMP "seamless-evaluation-survey.txt") -Force
          }

      - name: Upload nightly Dynamic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-dynamic-nightly-${{ matrix.mode }}-results
          path: |
            Benchmark.Dynamic.Tests/TestResults/**/*.trx
            ${{ runner.temp }}/seamless-evaluation-survey.txt
          if-no-files-found: ignore
