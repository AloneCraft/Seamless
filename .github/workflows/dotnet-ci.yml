name: .NET CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: dotnet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-ui:
    name: Benchmark UI build and tests
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show .NET info
        run: dotnet --info

      - name: Restore MAUI workloads
        run: dotnet workload restore .\Benchmark\Benchmark.UI\Benchmark.UI.csproj

      - name: Restore Benchmark UI
        run: dotnet restore .\Benchmark\Benchmark.UI\Benchmark.UI.csproj

      - name: Restore test project
        run: dotnet restore .\Test\Test.csproj

      - name: Run benchmark tests
        run: dotnet test .\Test\Test.csproj -c Debug -f net10.0-windows --no-restore --filter "FullyQualifiedName~CompletedRun_CanReloadSavedDatabaseRunAfterNewSelection|FullyQualifiedName~UiRunStoreTests|FullyQualifiedName~BenchmarkUiRunRepository" --logger "trx;LogFileName=benchmark-tests.trx"

      - name: Build Benchmark UI
        run: >
          dotnet build .\Benchmark\Benchmark.UI\Benchmark.UI.csproj
          -c Release
          -f net10.0-windows
          --no-restore
          "-p:BaseOutputPath=$env:RUNNER_TEMP\seamless-bin\"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-test-results
          path: Test/TestResults/**/*.trx
          if-no-files-found: ignore
