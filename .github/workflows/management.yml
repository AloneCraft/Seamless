name: Native management
on:
  pull_request:
    paths: ['Seamless.Management*/**', 'Seamless.FLinq.Generator/**', 'Tests/Management.Tests/**', '.github/workflows/management.yml']
  workflow_dispatch:
jobs:
  management:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DOTNET_PROCESSOR_COUNT: 8
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Server contracts, TLS, persistence and publication recovery
        shell: pwsh
        run: |
          $env:SEAMLESS_MANAGEMENT_TEST_ROOT=Join-Path $env:RUNNER_TEMP 'management-data'
          $env:SEAMLESS_MANAGEMENT_TEST_LOG=Join-Path $env:RUNNER_TEMP 'management-results'
          New-Item -ItemType Directory -Force -Path $env:SEAMLESS_MANAGEMENT_TEST_ROOT,$env:SEAMLESS_MANAGEMENT_TEST_LOG | Out-Null
          dotnet test Tests/Management.Tests/Management.Tests.csproj -c ${{ matrix.configuration }} --artifacts-path "$env:RUNNER_TEMP/management-artifacts" -p:UseSharedCompilation=false -m:1 --logger trx --results-directory $env:SEAMLESS_MANAGEMENT_TEST_LOG
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Build Windows GUI
        if: runner.os == 'Windows'
        run: dotnet build Seamless.Management.UI/SeamlessManager.csproj -c ${{ matrix.configuration }} --artifacts-path "${{ runner.temp }}/management-artifacts" -p:UseSharedCompilation=false -m:1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: management-${{ matrix.os }}-${{ matrix.configuration }}
          path: ${{ runner.temp }}/management-results
