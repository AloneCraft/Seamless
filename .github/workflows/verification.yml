name: Seamless verification

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      profile:
        description: Verification profile
        required: true
        default: quick
        type: choice
        options: [quick, full]
  schedule:
    - cron: "41 17 * * *"

concurrency:
  group: verification-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Verification foundation
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.profile == 'quick')
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        shell: pwsh
        run: |
          dotnet restore .\Verification.Tests\Verification.Tests.csproj
          dotnet restore .\Execution.Tests\Execution.Tests.csproj
          dotnet restore .\Test\Test.csproj
          dotnet workload restore .\Verification.UI\Verification.UI.csproj
          dotnet restore .\Verification.UI\Verification.UI.csproj
      - name: Test verification and execution contracts
        shell: pwsh
        run: |
          dotnet test .\Verification.Tests\Verification.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=verification.trx"
          dotnet test .\Execution.Tests\Execution.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=execution.trx"
      - name: Test database streaming, transactions, and recovery
        run: >
          dotnet test .\Test\Test.csproj -c Release -f net10.0 --no-restore
          --filter "FullyQualifiedName~DatabaseTransactionTests|FullyQualifiedName~DatabaseStoragePersistenceTests|FullyQualifiedName~SqlServerImportSizerTests|FullyQualifiedName~DatabaseToolImportIntegrationTests"
          --logger "trx;LogFileName=database-redesign.trx"
      - name: Build common CLI and MAUI app
        shell: pwsh
        run: |
          dotnet build .\Verification.Cli\Verification.Cli.csproj -c Release --no-restore
          dotnet build .\Verification.UI\Verification.UI.csproj -c Release -f net10.0-windows10.0.19041.0 --no-restore
      - name: Exercise explicit initialization and planning
        shell: pwsh
        run: |
          dotnet run --project .\Verification.Cli\Verification.Cli.csproj -c Release --no-build -- init --root $env:GITHUB_WORKSPACE
          dotnet run --project .\Verification.Cli\Verification.Cli.csproj -c Release --no-build -- plan --root $env:GITHUB_WORKSPACE --suite benchmark --profile quick --output "$env:RUNNER_TEMP\verification-plan.json"
      - name: Upload results and plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-foundation
          path: |
            **/TestResults/*.trx
            ${{ runner.temp }}/verification-plan.json
          if-no-files-found: ignore

  full:
    name: Full verification
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.profile == 'full')
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore MAUI workloads and verification CLI
        shell: pwsh
        run: |
          dotnet workload restore .\Verification.UI\Verification.UI.csproj
          dotnet restore .\Verification.Cli\Verification.Cli.csproj
      - name: Initialize verification database
        run: dotnet run --project .\Verification.Cli\Verification.Cli.csproj -c Release -- init --root $env:GITHUB_WORKSPACE
      - name: Run full suite
        run: dotnet run --project .\Verification.Cli\Verification.Cli.csproj -c Release --no-build -- run --root $env:GITHUB_WORKSPACE --suite all --profile full
      - name: Upload complete verification record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-full
          path: Work/Verification/**
          if-no-files-found: error
